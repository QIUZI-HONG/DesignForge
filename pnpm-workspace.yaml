# 设界 · pnpm workspace 定义（骨架见 docs/plan/skeleton-and-package-layout-v1.md）
# 注意：scripts/ 不是 workspace 包——它是工程脚本与门禁挂点目录，由根包直接持有。
packages:
  - apps/*
  - packages/*
  - services/*
  - tools/*

# 版本目录（catalog）：共享工具链与运行时依赖的单一版本来源，逐包以 `catalog:` 引用。
# 依据：docs/plan/skeleton-and-package-layout-v1.md §2「环境锁定」+ 前端实现规格 v1 §一。
catalog:
  # 工具链
  typescript: ~5.9.3
  vitest: 5.0.5
  # 覆盖率 provider（audit-d08 · D-11）：与 vitest 同版本锁，逐包以 catalog: 引用；
  # 版本必须随 vitest 一并升级（provider 与 vitest 内部接口强耦合）。
  '@vitest/coverage-v8': 5.0.5
  '@biomejs/biome': 2.5.15
  '@types/node': ^22.20.5
  # Web 前端（apps/web）
  next: 16.4.5
  react: 18.3.1
  react-dom: 18.3.1
  '@types/react': ^18.3.31
  '@types/react-dom': ^18.3.7
  zustand: ^5.0.15
  intl-messageformat: ^12.1.3
  '@fontsource/noto-sans-sc': ^5.3.1
  # 画布渲染（FE-06：Skia WASM；运行时资产由 apps/web/src/features/canvas/tools/copy-canvaskit-assets.mjs 复制到 public）
  canvaskit-wasm: 0.42.0
  # 组件测试（FE-01 起；_shared §3：组件加 jsdom + @testing-library/react）
  jsdom: ^30.1.3
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  # 浏览器门禁（FE-01 起；研究 #5《对照工具链选型》选型：playwright-core 显式 executablePath + pixelmatch）
  playwright-core: 1.63.0
  pixelmatch: 8.0.0
  pngjs: 7.0.0
  # 本地服务（apps/daemon）
  fastify: ^5.12.8
  # 桌面壳（apps/desktop；FE-12 落地）
  electron: 44.9.1

# 依赖版本覆盖（audit-d09 · D-12）：fast-uri 8 条 moderate/low 均随 fastify 传递依赖进来，
# 分两条线——@fastify/ajv-compiler 直用 4.x（修复版 ≥4.2.3）、ajv@8.20 用 3.x（修复版 ≥3.1.9）。
# 按大版本线分别钉到各自修复版，不跨大版本强制升级（避免破坏 ajv 对 fast-uri 3.x 的接口假设）。
overrides:
  'fast-uri@<4': 3.1.9
  'fast-uri@>=4': 4.2.3
