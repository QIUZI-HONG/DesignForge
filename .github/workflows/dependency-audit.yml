# 生产依赖审计（审计 10b · #108 / #60 P0-6）
#
# 每周定时 + 手动触发；**不进 PR 必过门禁**——npm registry 审计端点存在网络 flake，
# 不能让它随机卡住合并。策略（禁止假绿）：
#   - 发现 high/critical 漏洞 → exit 1（红，需处置）；
#   - 连续 3 次网络失败 → exit 2（阻塞，明确标记 registry 不可达，**不是通过**）；
#   - 仅对网络类错误重试，不对漏洞结果重试。
# 公开仓库用默认 npm registry 无需凭据。若接入私有 registry，需在仓库 secrets 配置
# NPM_TOKEN，见 docs/quality/audit-v1/60-ci-hardening.md「人工项 · pnpm audit」。
name: dependency-audit

on:
  schedule:
    - cron: "23 2 * * 1" # 每周一 02:23 UTC（10:23 CST）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁定文件，不可漂移）
        run: pnpm install --frozen-lockfile

      - name: pnpm audit --prod（high/critical 阻断；网络失败重试后按阻塞退出）
        run: |
          set -u
          attempts=3
          for i in $(seq 1 "$attempts"); do
            set +e
            output=$(pnpm audit --prod --audit-level=high 2>&1)
            code=$?
            set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 0 ]; then
              echo "OK：pnpm audit --prod 无 high/critical 已知漏洞（第 $i/$attempts 次）。"
              exit 0
            fi
            if printf '%s' "$output" | grep -Eq 'ERR_PNPM_AUDIT_BAD_RESPONSE|ERR_PNPM_META_FETCH_FAIL|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|socket hang up|fetch failed'; then
              echo "网络 flake：审计端点不可达（第 $i/$attempts 次），$(($i * 15))s 后重试…"
              sleep $(($i * 15))
              continue
            fi
            echo "违规：pnpm audit 失败（exit=$code）——按漏洞/审计结果处理，不得当绿。"
            exit 1
          done
          echo "阻塞：pnpm audit 连续 $attempts 次网络失败（registry 不可达）。这是阻塞，不是通过。"
          exit 2
