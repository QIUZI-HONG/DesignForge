name: ci

# 设界 · 主 CI（骨架期口径，见 docs/plan/skeleton-and-package-layout-v1.md §2）
# 链路：安装（frozen lockfile）→ 逐包 lint（含根 scripts 门禁脚本 lint）→ 逐包 typecheck → 逐包测试
#      → 脚本单测 → **非浏览器门禁**（守卫 / 引擎 / FE-10 两态 / 参照集·动效·性能阻塞语义；明细见文末挂点说明）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取自根 package.json 的 packageManager（pnpm@10.33.2）

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # engines.node >= 22；本仓开发机为 node 24
          cache: pnpm

      - name: 安装依赖（锁定文件，不可漂移）
        run: pnpm install --frozen-lockfile

      - name: 静态检查（逐包 + 根 scripts）
        run: pnpm lint

      # 全量诊断转储（不阻断）：biome 默认截断 20 条，修复轮次里隐藏项反复挤牙膏；
      # 本步一次性打印全部诊断供修复方使用。始终运行（lint 红也照跑）。
      - name: 全量诊断转储（biome --max-diagnostics=999，不阻断）
        if: always()
        run: pnpm exec biome check . --max-diagnostics=999 || true

      - name: 类型检查（逐包 tsc --noEmit）
        run: pnpm typecheck

      - name: 单元测试（逐包 vitest）
        run: pnpm test

      # --- 覆盖率报数（audit-d08 · D-11：coverage 常设化）----------------------------
      # 口径：逐包 `test:coverage`（vitest v8 provider，只统计各包 `src/**`，json-summary
      # 落各包 coverage/coverage-summary.json）→ `coverage:report` 打印逐包行/分支摘要与
      # 关键分支目标集（daemon routes 目标集 · cli 命令参数面目标集）聚合。
      # **本步是「报数」不是「门禁」**：阈值（核心行 ≥80% · 关键分支 ≥90%）只在输出里
      # 标 ⚠ 不改退出码；coverage:report 的非零退出只代表结构问题（产物全缺/不可解析，
      # 即报数管线断了），不是覆盖率判定——阈值是否升格为门禁由后续票按三态语义决策。
      # 代价如实记录：全量用例在本步跑第二遍（覆盖率桩点插装的开销换逐包可复核数字）；
      # 既有 `pnpm test` 步骤原样保留（不放宽、不合并）。
      - name: 覆盖率报数（逐包 test:coverage + 行/分支摘要；audit-d08 · D-11）
        run: |
          pnpm test:coverage
          pnpm coverage:report

      # --- 非浏览器门禁（C5 接入：离线可判定的一律进 CI） -------------------------------

      - name: 脚本单测（差异包围盒 bbox + 守卫检出强度回归，node --test）
        run: pnpm test:scripts

      - name: 令牌守卫（禁裸值；规则 R1/R2/R3）
        run: pnpm guard:tokens

      - name: 词表同源守卫（kind/lane 等规范词表唯一真源在 @dforge/contracts；层内字面量即违规）
        run: pnpm guard:vocab

      - name: feature 边界守卫（跨 feature 深导入归零；register 接缝为登记例外，ADR-0004 ②）
        run: pnpm guard:feature-boundaries

      - name: 桌面壳安全基线守卫（窗口选项静态断言；对抗夹具回归在 pnpm test:scripts）
        run: pnpm guard:electron-baseline

      - name: 引擎门禁（对抗用例 + 快照哈希回归）
        run: pnpm verify:engine

      # --- FE-10 两态门禁接 CI（tp1-05；spec：测试执行阶段 1 ⑤）-------------------------
      # 口径（禁假绿）：verify-mcp-stub 全程非浏览器（真实 daemon + 进程内 harness +
      # 临时数据根，不出机）→ 在 CI 完整判定，must-green。
      # verify-ai/image-two-state 的**数据面两态**（真实 daemon + mock 上游 / mock ComfyUI +
      # 临时数据根，不出机）在 CI **真跑**；**UI 挂载段**需真 Chromium（CI 无）→ 按三态语义
      # 阻塞（exit 2）。脚本退出码优先级为「违规 1 优先于阻塞 2」，故 exit 2 且证据 JSON
      # 「数据面 0 失败 + 阻塞原因非空」⇔ 数据面全过、仅 UI 段阻塞——据此断言：
      #   exit 0 = 全过（含 UI 段；前置齐备后改为必须 exit 0）；
      #   exit 1 = 数据面真违规（红）；
      #   exit 2 仅当证据合格（bootstrap 阻塞如 daemon 起不来会留下失败步骤 → 红）；
      #   其余退出码一律红。
      # 判码已抽共享裁决 scripts/lib/two-state-verdict.mjs（tp2-03 去重；单测在
      # scripts/tests/two-state-verdict.test.mjs，随「脚本单测」步跑）——语义与
      # tp1-05 原两段内联判码逐语义等价，门禁脚本本身与口径未变。
      # NODE_OPTIONS：脚本直跑前端 .ts 适配层，node 22.6–23.5 需 type-stripping 旗标
      # （22.18+ 缺省已开，显式设置无害，跨 22.x 补丁版稳定）。
      - name: MCP 桩契约门禁（两态 + 显式桩标注；非浏览器，CI 完整判定）
        env:
          NODE_OPTIONS: --experimental-strip-types
          DF_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/gate-evidence
        run: pnpm verify:mcp-stub

      - name: AI 两态门禁（数据面真跑；UI 挂载段无 Chromium → 阻塞语义，挂点）
        env:
          NODE_OPTIONS: --experimental-strip-types
          DF_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/gate-evidence
        run: |
          set +e
          node scripts/verify-ai-two-state.mjs
          code=$?
          set -e
          node scripts/lib/two-state-verdict.mjs artifacts/verify-ai-two-state/evidence.json "$code" "AI 两态门禁"

      - name: 出图两态门禁（数据面真跑；UI 挂载段无 Chromium → 阻塞语义，挂点）
        env:
          NODE_OPTIONS: --experimental-strip-types
          DF_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/gate-evidence
        run: |
          set +e
          node scripts/verify-image-two-state.mjs
          code=$?
          set -e
          node scripts/lib/two-state-verdict.mjs artifacts/verify-image-two-state/evidence.json "$code" "出图两态门禁"

      # 参照集门禁在 CI 无参照集，**必须** exit 2（阻塞）并点名「参照集未冻结」：
      #   本步骤断言的是**三态语义契约**（脚本确已执行、不得零校验 exit 0 假绿），
      #   不是「门禁通过」；参照集冻结（REF-01）且 CI 可达后改为要求 exit 0。
      - name: 参照集冻结元数据门禁（断言阻塞语义：无参照集 → exit 2）
        run: |
          set +e
          output=$(node scripts/verify-figma-baseline.mjs 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "参照集在 CI 可达：门禁正式判定通过（REF-01 已冻结）；本步骤此后应改为必须 exit 0。"
            exit 0
          fi
          if [ "$code" -ne 2 ] || ! printf '%s' "$output" | grep -q '阻塞：参照集未冻结'; then
            echo "违规：参照集门禁的退出码/日志不符三态语义（exit=$code；期望 2 + 「阻塞：参照集未冻结」）"
            exit 1
          fi
          echo "OK：无参照集 → exit 2（阻塞，非通过）且日志点名「参照集未冻结」——门禁确已执行。"

      # 动效门禁（RW-01 交付）当前为**挂点**（断言实现待阶段 1「设计系统底座」），真实现前
      # **必须** exit 2（阻塞）并点名「断言未实现」：本步骤断言的是**三态语义契约**
      # （脚本确已执行、不得零校验 exit 0 假绿），不是「门禁通过」；阶段 1 接入真实断言后
      # 改为要求 exit 0。
      - name: 动效实际生效门禁（断言阻塞语义：挂点未实现 → exit 2）
        run: |
          set +e
          output=$(node scripts/verify-motion.mjs 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "动效断言已在 CI 判定通过（挂点已转真实现）：本步骤此后应改为必须 exit 0。"
            exit 0
          fi
          if [ "$code" -ne 2 ] || ! printf '%s' "$output" | grep -q '阻塞：动效实际生效断言未实现'; then
            echo "违规：动效门禁的退出码/日志不符挂点语义（exit=$code；期望 2 + 「阻塞：动效实际生效断言未实现」）"
            exit 1
          fi
          echo "OK：挂点未实现 → exit 2（阻塞，非通过）且日志点名「断言未实现」——门禁确已执行。"

      # 渲染性能门禁 verify:perf——基线已实采转正（docs/quality/perf-baseline-v1.json
      # provisional:false，dev 机真链路实采校准，audit-d07 · D-09 ③），dev 机上是**正式判定**
      # （0=判定档全达标 / 1=实测超阈即真违规，不再恒阻塞）。CI 接入形态为**「正式判定挂点」**
      # （与 figma-baseline 阻塞语义断言同构且更收紧）：
      #   exit 0 = 正式判定通过（收）；
      #   exit 1 = 实测超阈值（红，真违规，禁以环境理由掩盖）；
      #   exit 2 = 仅当基线 JSON `provisional === false`（已实采转正）才按挂点语义收
      #            （「CI 无真链路」族阻塞——Chromium 缺失 / web 构建 / daemon 起不来；
      #            阻塞不是通过）；基线回退（provisional:true）、字段缺失/基线不可读 → 红。
      # 勘误（audit-d07b · run 42313746571 翻车修复）：原写法「日志含 provisional 字样即红」
      # 误伤 exit 2 的合法阻塞文案（文案本身就含该字样）→ CI（无 Chromium 恒 exit 2）
      # 永不可能绿；判据改为**查基线 JSON 状态字段**（共享裁决 scripts/lib/perf-ci-judgment.mjs，
      # 单测 scripts/tests/perf-ci-judgment.test.mjs 随「脚本单测」步跑）——判定强度不降
      # （provisional:true 回退依旧红），门禁输出文案不动（含 provisional 字样从此无害）。
      # 严格正式判定（仅 exit 0 绿）待 CI 具备真链路（Chromium + 阈值跨机校准——现阈值按
      # dev 机校准且贴地，跨机直判必红）后由浏览器门禁票收口。
      - name: 渲染性能门禁（正式判定挂点：exit 0 收 / exit 1 红 / exit 2 仅基线转正态阻塞）
        run: |
          set +e
          node scripts/verify-perf.mjs
          code=$?
          set -e
          node scripts/lib/perf-ci-judgment.mjs docs/quality/perf-baseline-v1.json "$code" "渲染性能门禁"

      # ---------------------------------------------------------------------------------
      # 未接入本 CI 的门禁与原因（**不许注释说接了实际没接**）：
      #   - 浏览器门禁（挂点，随对应实现票接入）：
      #       pnpm verify:figma-home / verify:figma-editor / verify:figma-panels /
      #       verify:figma-inspect / verify:figma-inspector / verify:figma-component
      #       （逐页/逐组件对照）、pnpm verify:canvas（画布挂载 6 断言）、
      #       pnpm e2e:smoke（10 步冒烟）、pnpm verify:shell-parity（FE-12 壳内一致性）。
      #       驱动口径：playwright-core 1.63.0 锁 chromium-1243，生产构建 + headless；
      #       需 Chromium 与冻结参照集，CI 暂不具备。
      #   - verify:figma-baseline 的**正式判定**（像素/哈希对照）：参照集按纪律存仓库外
      #     （~/df-evidence/reference-v1，见 implementation-workflow.md「证据存仓库外」），
      #     CI 环境不存在 → 只会是 exit 2；本轮只断言其阻塞语义（上方步骤），
      #     REF-01 冻结且参照集在 CI 可达后改为正式接入。
      #   - verify:motion / verify:perf 的**正式判定**：未接入（motion：断言实现待阶段 1，
      #     挂点恒 exit 2；perf：基线已实采转正（audit-d07），dev 机正式判定 0/1，但 CI 无
      #     真链路（Chromium）恒 exit 2，且阈值按 dev 机校准贴地、跨机直判必红）——perf 的
      #     **「正式判定挂点」**已接入（上方步骤：exit 0 收 / exit 1 红 / exit 2 仅当基线
      #     provisional:false 可收 + 基线回退红；判据查基线 JSON 字段不查日志文本，
      #     audit-d07b 勘误），严格正式判定随浏览器门禁票收口；motion 仍为
      #     阻塞语义断言（上方步骤），各自前提齐备后改为正式接入。
      #   - pnpm verify:mk-01：判据来自 ~/df-evidence/mk-01 的采集产物（需真网 + GH_TOKEN
      #     采集，产物按纪律存仓库外）→ CI 内无产物，只会 exit 2（阻塞），故不接；
      #     其离线重放路径（--replay 冻结样本）由 services/ingest 单测覆盖（pnpm test）。
      #   - FE-10 两态门禁（tp1-05 接入，见上方步骤）：verify:mcp-stub 全量接入（must-green）；
      #     verify:ai/image-two-state 接的是「数据面两态真跑 + UI 段阻塞语义」——其 UI 挂载段
      #     （playwright-core + 真 Chromium）CI 无浏览器，恒 exit 2，仍为挂点，随浏览器门禁票
      #     接入；verify:mcp-stub 的宿主页截图探测依赖 DF_WEB_URL，未配置即如实记
      #     not-configured（不影响契约判定）。
      #   - 未实现守卫 guard:deps / guard:mcp-contract / guard:channel-pairing：当前一律
      #     exit 2（阻塞，禁止当绿），按 implementation-workflow.md「不接 CI」，
      #     实现后由接管票一并接入本文件。
      # ---------------------------------------------------------------------------------
